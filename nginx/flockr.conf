# /etc/nginx/sites-available/flockr
# ─────────────────────────────────────────────────────────────────────────────
# Flockr — Laravel 11 on Ubuntu 22/24
# Copy to: /etc/nginx/sites-available/flockr
# Enable: sudo ln -s /etc/nginx/sites-available/flockr /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zones (defined at http level — put in nginx.conf if preferred)
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name flockr.ng www.flockr.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flockr.ng www.flockr.ng;

    root /var/www/flockr/public;
    index index.php;

    # ── SSL (managed by Certbot / Let's Encrypt) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/flockr.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flockr.ng/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # ── Client upload size (video uploads) ────────────────────────────────
    client_max_body_size 500M;
    client_body_timeout  300s;

    # ── Static assets — cache aggressively ───────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Laravel Reverb WebSocket (if using Reverb instead of Pusher) ──────
    location /app/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 60s;
    }

    # ── Rate limit: API endpoints ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate limit: video upload ──────────────────────────────────────────
    location /api/videos/upload {
        limit_req zone=upload burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate limit: auth routes ───────────────────────────────────────────
    location ~ ^/(login|register|forgot-password) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Main Laravel handler ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Block sensitive files ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
    location ~ /\.env {
        deny all;
        return 404;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── PHP-FPM ───────────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass  unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include       fastcgi_params;

        # Pass real client IP (if behind a load balancer / Cloudflare)
        fastcgi_param HTTP_X_REAL_IP        $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR  $proxy_add_x_forwarded_for;

        fastcgi_read_timeout 300;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
    }

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/flockr_access.log;
    error_log  /var/log/nginx/flockr_error.log;
}
