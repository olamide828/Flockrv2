# ─────────────────────────────────────────────────────────────────────────────
# Flockr — Supervisor config for Laravel queue workers
#
# Install: sudo apt install supervisor
# Copy to: /etc/supervisor/conf.d/flockr.conf
# Apply:   sudo supervisorctl reread && sudo supervisorctl update
# Status:  sudo supervisorctl status
# ─────────────────────────────────────────────────────────────────────────────

# ── Default queue — general jobs (emails, notifications, order updates) ──────
[program:flockr-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/flockr/artisan queue:work redis \
    --queue=default \
    --sleep=3 \
    --tries=3 \
    --max-time=3600 \
    --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/flockr/worker-default.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60

# ── Video queue — CPU-intensive: ffmpeg + Whisper (run fewer, more memory) ───
[program:flockr-worker-videos]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/flockr/artisan queue:work redis \
    --queue=videos \
    --sleep=5 \
    --tries=3 \
    --max-time=600 \
    --memory=512 \
    --timeout=650
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/flockr/worker-videos.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=700

# ── AI queue — OpenAI + Jina calls (rate-limited, run conservatively) ────────
[program:flockr-worker-ai]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/flockr/artisan queue:work redis \
    --queue=ai \
    --sleep=3 \
    --tries=3 \
    --max-time=3600 \
    --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/flockr/worker-ai.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60

# ── Scheduler — runs every minute (replaces cron for Laravel) ────────────────
[program:flockr-scheduler]
process_name=%(program_name)s
command=php /var/www/flockr/artisan schedule:work
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/flockr/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

# ── Laravel Reverb WebSocket server (use if not using Pusher) ────────────────
[program:flockr-reverb]
process_name=%(program_name)s
command=php /var/www/flockr/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/flockr/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
